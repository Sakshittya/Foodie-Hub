<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order History | FoodieHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light"><div class="container"><a class="navbar-brand fw-bold" href="index.html">FoodieHub</a><div><a href="index.html" class="btn btn-outline-dark btn-sm">Home</a> <a href="about.html" class="btn btn-outline-dark btn-sm">About</a> <a href="cart.html" class="btn btn-success btn-sm">🛒 Cart <span id="cartCount">0</span></a> <a id="loginLink" href="login.html" class="btn btn-warning btn-sm">Login</a> <button id="logoutButton" class="btn btn-outline-dark btn-sm d-none">Logout</button></div></div></nav>
<main class="container my-5"><h2 class="text-center mb-4">Your Orders</h2><p id="ordersMessage" class="text-center" role="status">Loading orders…</p><div id="ordersList"></div><div class="text-center mt-4"><a href="index.html" class="btn btn-primary">Continue Shopping</a></div></main>
<script src="script.js"></script><script>
function formatDate(value){return new Date(value).toLocaleString();}
async function loadOrders(){
  try {
    const {orders}=await api('/api/orders');const list=document.getElementById('ordersList');
    document.getElementById('ordersMessage').textContent=orders.length?'':'No orders yet.';
    list.innerHTML=orders.map(order=>`<div class="card shadow-sm mb-3"><div class="card-header d-flex flex-wrap justify-content-between gap-2"><strong>Order #${order.id}</strong><span>${escapeHtml(formatDate(order.created_at))}</span></div><div class="card-body"><p class="mb-1">Status: <strong>${escapeHtml(order.order_status)}</strong> · Cash on Delivery</p><p class="mb-2">Delivery: ${escapeHtml(order.delivery_address)}</p><ul class="mb-2">${order.items.map(item=>`<li>${escapeHtml(item.food_name)} × ${item.quantity} — ${money(item.subtotal)}</li>`).join('')}</ul><strong>Total: ${money(order.total_amount)}</strong></div></div>`).join('');
  } catch(error) { if(error.loginRequired){showMessage('ordersMessage','Please log in to view your order history.');setTimeout(()=>location.href='login.html',900);}else showMessage('ordersMessage',error.message); }
}
document.addEventListener('DOMContentLoaded',loadOrders);
</script></body></html>
